# ============================================================
# CineMatch pipeline configuration
# All tunables live here so experiments don't require code edits
# ============================================================

paths:
  raw_movies_csv: "data/raw/tmdb_5000_movies.csv"
  raw_credits_csv: "data/raw/tmdb_5000_credits.csv"
  processed_csv: "data/processed/movies_with_tags.csv"
  vectorizer_path: "models/vectorizer.pkl"
  similarity_path: "models/similarity.npz"
  indices_path: "models/indices.pkl"
  titles_path: "models/titles.pkl"

columns:
  id_col: "id"
  title_col: "title"
  overview_col: "overview"
  genres_col: "genres"
  keywords_col: "keywords"
  cast_col: "cast"
  crew_col: "crew"
  tags_col: "tags"

feature_engineering:
  top_cast_n: 3          # how many top-billed cast members to include
  include_director: true
  lowercase: true
  strip_spaces_in_names: true   # "Sam Worthington" -> "samworthington" (avoids first-name collisions)

vectorizer:
  method: "tfidf"          # "tfidf" or "count"
  max_features: 5000
  stop_words: "english"
  ngram_range: [1, 2]
  min_df: 1

similarity:
  metric: "cosine"

recommend:
  default_top_k: 5
  fuzzy_match_threshold: 0.6   # for approximate title matching

logging:
  level: "INFO"
